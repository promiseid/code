# Optional Apache directives to merge into an existing virtual host.
# Enable the corresponding modules first. Test in staging; do not overwrite
# WordPress routing, TLS, or WooCommerce cache exclusions.
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json image/svg+xml
</IfModule>
<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresByType text/css "access plus 30 days"
  ExpiresByType application/javascript "access plus 30 days"
  ExpiresByType image/webp "access plus 30 days"
  ExpiresByType image/png "access plus 30 days"
  ExpiresByType image/svg+xml "access plus 30 days"
  ExpiresByType font/woff2 "access plus 1 year"
</IfModule>
# These directives do not enable full-page caching. Cart, checkout,
# authenticated pages and wc-ajax requests must stay outside public page caches.
