# Optional directives to merge into an existing Nginx http/server configuration.
# Existing location blocks may conflict; have the hosting provider merge and test.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

